services:
  - type: web
    name: lumi-ai-backend
    runtime: docker
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: MEETINGS_POLL_SECRET
        sync: false
      - key: BACKEND_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
